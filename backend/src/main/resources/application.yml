server:
  port: 9090
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: seckill-platform
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/seckill_platform?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      encoding: UTF-8
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 64
          max-idle: 16
          min-idle: 4
          max-wait: 2000ms
  jackson:
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      insert-strategy: not_null
      update-strategy: not_null

seckill:
  jwt:
    secret: ${JWT_SECRET:seckill-platform-demo-secret-key-please-change-in-production-2024}
    admin-expire-seconds: 7200          # 管理端 2 小时
    user-expire-seconds: 604800         # 用户端 7 天
  upload-dir: ${UPLOAD_DIR:E:/seckill-platform/uploads}
  order-timeout-minutes: 15             # 订单支付超时时间
  cache:
    product-ttl-seconds: 1800
    activity-ttl-seconds: 60

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.seckill: info
    org.springframework.jdbc.datasource.init: warn
    org.apache.ibatis: warn
